spring:
  application:
    name: api_gateway_service
  main:
    web-application-type: reactive
server:
  port: 8081
  address: 0.0.0.0
eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    hostname: localhost
    prefer-ip-address: true
springdoc:
  swagger-ui:
    urls:
      - url: /swagger/admin-service
        name: Admin Service
      - url: /swagger/authenticate-service
        name: Authenticate Service
      - url: /swagger/appointment-service
        name: Appointment Service